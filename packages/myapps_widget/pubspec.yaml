name: myapps_widget
description: Flutter bridge that stores widget envelopes and redraws Android and iOS home-screen widgets.
version: 0.2.0
publish_to: none
environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"
dependencies:
  myapps_widget_core:
    path: ../myapps_widget_core
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      android:
        package: com.yuanzhe.myapps_widget
        pluginClass: MyAppsWidgetPlugin
      ios:
        pluginClass: MyAppsWidgetPlugin
