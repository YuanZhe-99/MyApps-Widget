name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tool/check_docs.py
      - run: git diff --check
  flutter:
    # Applications build with Flutter 3.44.2; every package must pass there.
    strategy:
      fail-fast: false
      matrix:
        package: [myapps_widget_core, myapps_widget, myapps_widget_ui]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
  android:
    # Compiles the plugin inside a generated host app and runs the Kotlin
    # contract test against contract/.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true
      - run: bash tool/create_host.sh "$RUNNER_TEMP/host"
      - working-directory: ${{ runner.temp }}/host
        run: flutter build apk --debug
      - working-directory: ${{ runner.temp }}/host/android
        env:
          MYAPPS_WIDGET_CONTRACT: ${{ github.workspace }}/contract
        run: ./gradlew :myapps_widget:testDebugUnitTest
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true
      - run: bash tool/check_swift_contract.sh
      - run: bash tool/create_host.sh "$RUNNER_TEMP/host"
      - working-directory: ${{ runner.temp }}/host
        run: flutter build ios --debug --no-codesign
